<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>上传文件</title>
</head>
<body>
<!--前端上传三要素 method="post" enctype="multipart/form-data"  name="file"-->
<form action="/upload" method="post" enctype="multipart/form-data">
    姓名: <input type="text" name="name"><br>
    年龄: <input type="text" name="age"><br>
    头像: <input type="file" name="file"><br>
<!--    前端上传文件之后，会有后端的UploadController进行接收(upload方法，MultipartFile file用于接收前端上传的文件)-->
    <input type="submit" value="提交">
</form>

</body>
</html>
